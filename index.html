<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<title>Quiz SIPAT Tormenta 2026</title>
<style>
  :root {
    --bg: #0d2a1a; --bg2: #14532d; --card: #ffffff; --ink: #1d1d2b; --muted: #6b6b80;
    --a: #e21b3c; --b: #1368ce; --c: #d89e00; --d: #26890c; --ok: #1fa34a; --bad: #e21b3c;
    --accent: #ffcc00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: url(img/fundo.jpg) center / cover fixed, radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 70%) fixed;
    color: #fff; min-height: 100vh; overflow-x: hidden;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
  .center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .card { background: var(--card); color: var(--ink); border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .card.wide { max-width: 1000px; }
  h1 { margin: 0 0 8px; font-size: 32px; }
  h2 { margin: 0 0 12px; }
  input[type=text], input[type=tel], input[type=password], select {
    width: 100%; font-size: 20px; padding: 12px; border: 2px solid #ccc; border-radius: 10px; margin: 6px 0 12px; font-weight: 700; font-family: inherit;
  }
  .card input { text-align: center; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 14px 22px; font-weight: 800; font-size: 18px; }
  button:disabled { opacity: .45; cursor: default; }
  .btn { background: #333; color: #fff; width: 100%; }
  .btn.primary { background: var(--bg2); }
  .btn.go { background: var(--ok); }
  .btn.warn { background: var(--bad); }
  .btn.light { background: #fff; color: var(--ink); }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); }
  .link { background: none; color: #cfe; text-decoration: underline; font-weight: 400; font-size: 15px; padding: 8px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); font-weight: 700; min-height: 1.2em; margin-top: 8px; }
  .small { font-size: 14px; }
  .badge { display: inline-block; background: rgba(255,255,255,.15); padding: 6px 14px; border-radius: 999px; font-weight: 700; }

  /* marca (imagens da apresentação SIPAT 2026) */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; --w: 460px; }
  .brand.sm { --w: 280px; } .brand.xl { --w: 820px; }
  .brand .tor { display: flex; align-items: center; gap: 10px; font-family: 'Lilita One', 'Segoe UI', sans-serif; font-size: calc(var(--w) * .075); line-height: .9; text-align: left; letter-spacing: 1px; }
  .brand .tor img { width: calc(var(--w) * .1); }
  .brand .tor small { display: block; font-size: .55em; font-family: 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: 0; }
  .brand .logo { width: min(var(--w), 90vw); filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .brand .ano { font-family: 'Lilita One', 'Segoe UI', sans-serif; color: #0b3d1c; font-size: calc(var(--w) * .13); line-height: 1;
    background: url(img/pincel-branco.png) center / 100% 100% no-repeat; padding: .08em .6em .12em; margin-top: calc(var(--w) * -.05); transform: rotate(-3deg); }
  .brand .lema { font-family: 'Lilita One', 'Segoe UI', sans-serif; font-size: calc(var(--w) * .062); line-height: 1.05; text-align: center;
    background: url(img/pincel-verde.png) center / 100% 100% no-repeat; padding: .35em 1.2em .45em; margin-top: 8px; transform: rotate(-2deg); }
  .brand .lema span { display: block; } .brand .lema .y { color: var(--accent); }
  .brand.sm .lema { display: none; }
  .planta { position: fixed; right: -20px; bottom: -20px; width: min(320px, 35vw); pointer-events: none; opacity: .95; z-index: 0; }
  .presente { width: 110px; animation: shake 1s ease-in-out infinite; }
  h1, .qtext, .code, .huge, .big { font-family: 'Lilita One', 'Segoe UI', sans-serif; font-weight: 400; letter-spacing: .5px; }

  /* opções */
  .opts { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
  .opt { color: #fff; border-radius: 14px; padding: 14px 20px; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 16px; text-align: left; min-height: 76px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); width: 100%; }
  .opt .sh { flex: none; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 28px; }

  /* mascote Tormentinha */
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .masc { display: flex; align-items: center; gap: 4px; }
  .masc img { width: 190px; flex: none; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .masc .fala { position: relative; background: #fff; color: var(--ink); border-radius: 20px; padding: 16px 22px; font-family: 'Lilita One', sans-serif; font-size: 28px; line-height: 1.15; animation: pop .6s .3s cubic-bezier(.2,1.4,.4,1) both; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .masc .fala::before { content: ''; position: absolute; left: -18px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right: 18px solid #fff; border-left: 0; }
  .masc .fala b { color: var(--d); }
  .masc.big img { width: 300px; } .masc.big .fala { font-size: 40px; }
  .selo { position: fixed; right: 18px; bottom: 12px; width: 150px; opacity: .9; pointer-events: none; z-index: 0; }

  /* estatísticas */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { border-radius: 16px; padding: 14px; text-align: center; background: #fff; color: var(--ink); border-top: 8px solid var(--bg2); animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .kpi .v { font-family: 'Lilita One', sans-serif; font-size: 64px; line-height: 1; color: var(--bg2); }
  .kpi .l { font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #555; }
  .kpi .nm { font-weight: 800; font-size: 20px; margin-top: 4px; word-break: break-word; }
  .kpi.ok { border-color: var(--ok); } .kpi.ok .v { color: var(--ok); }
  .kpi.err { border-color: var(--bad); } .kpi.err .v { color: var(--bad); }
  .kpi.na { border-color: #8a929c; } .kpi.na .v { color: #6b7380; }
  .kpi.t { border-color: var(--accent); } .kpi.t .v { font-size: 46px; }
  .bloco2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 8px; }
  .bloco2 .tempos { display: grid; gap: 10px; }
  .bloco2 .tempos .kpi { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 10px 18px; border-top: 0; border-left: 8px solid var(--accent); }
  .bloco2 .tempos .kpi .v { font-size: 40px; grid-row: span 2; }
  .porletra { background: #fff; color: var(--ink); border-radius: 16px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(0,0,0,.25); animation: pop .6s .2s both; }
  .porletra .t { font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 8px; }
  .porletra .cols { display: flex; gap: 22px; align-items: flex-end; justify-content: center; height: 210px; }
  .porletra .c { width: 90px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .porletra .c b { font-family: 'Lilita One', sans-serif; font-size: 34px; font-weight: 400; color: #6b7380; }
  .porletra .c i { display: block; width: 100%; height: 6px; background: #c9ced6; border-radius: 10px 10px 0 0; transition: height 1.3s cubic-bezier(.2,1,.3,1); }
  .porletra .c span { margin-top: 6px; width: 44px; height: 44px; border-radius: 50%; background: #e7eaee; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 24px; }
  .porletra .c.certa b { color: var(--ok); } .porletra .c.certa i { background: var(--ok); } .porletra .c.certa span { background: var(--ok); color: #fff; }

  /* raio-x da pergunta: rosca + bonequinhos */
  .raiox { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; }
  .rx-card { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px 20px; box-shadow: 0 8px 20px rgba(0,0,0,.25); animation: pop .6s both; }
  .rx-card .t { font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 10px; }
  .donut { display: flex; align-items: center; gap: 18px; }
  .dn { position: relative; width: 210px; flex: none; }
  .dn .cen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dn .cen b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 58px; line-height: 1; color: var(--ok); }
  .dn .cen span { font-family: 'Lilita One', sans-serif; font-size: 24px; color: var(--ok); margin-top: -6px; }
  .dn .cen small { font-weight: 800; color: #666; }
  .leg { display: grid; gap: 12px; flex: 1; }
  .leg div { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .leg i { width: 16px; height: 16px; border-radius: 4px; }
  .leg b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 36px; }
  .picto { display: flex; flex-wrap: wrap; gap: 6px; min-height: 120px; align-content: flex-start; }
  .pp { width: 26px; height: 42px; fill: #dfe3e8; animation: acende .35s both; }
  .picto.p2 .pp { width: 20px; height: 32px; } .picto.p3 .pp { width: 15px; height: 24px; gap: 4px; }
  @keyframes acende { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .pp.ok { fill: var(--ok); } .pp.er { fill: var(--bad); } .pp.na { fill: #b8bfc8; }
  .letras { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .letras div { display: flex; align-items: center; gap: 8px; background: #f0f2f5; border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 800; }
  .letras span { width: 32px; height: 32px; border-radius: 50%; background: #d5dae1; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; }
  .letras b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 22px; }
  .letras .certa { background: #dff3e6; color: #12612e; } .letras .certa span { background: var(--ok); color: #fff; }

  /* pergunta bônus e sequência */
  .bonusbar { display: inline-block; background: var(--accent); color: #0b3d1c; font-family: 'Lilita One', sans-serif; font-size: 30px; padding: 6px 26px; border-radius: 999px; animation: pulse 1s infinite; box-shadow: 0 0 30px rgba(255,204,0,.6); }
  .fogo { margin-left: 6px; }

  /* sala de espera: dicas e contagem */
  .dica { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 10px 14px; margin-top: 16px; }
  .dica .masc img { width: 110px; } .dica .masc .fala { font-size: 22px; }
  .crono { font-family: 'Lilita One', sans-serif; font-size: 54px; color: var(--accent); }
  .crono-bt { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .crono-bt button { padding: 6px 12px; font-size: 14px; width: auto; }

  /* pódio montado na revelação */
  .stage { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-top: 50px; }
  .slot { width: 260px; text-align: center; }
  .slot.pend { visibility: hidden; }
  .slot.land { animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; }
  .slot .nm { font-family: 'Lilita One', sans-serif; font-size: 30px; line-height: 1.05; word-break: break-word; margin-bottom: 4px; }
  .slot .pt { font-weight: 800; opacity: .9; margin-bottom: 8px; }
  .slot .blk { border-radius: 14px 14px 0 0; display: flex; justify-content: center; padding-top: 14px; font-family: 'Lilita One', sans-serif; font-size: 64px; color: var(--ink); box-shadow: inset 0 -10px 0 rgba(0,0,0,.12); }
  .slot.s1 .blk { height: 250px; background: linear-gradient(160deg, #fff3a6, #ffd700 50%, #d9a400); }
  .slot.s2 .blk { height: 185px; background: linear-gradient(160deg, #ffffff, #d4d9e1); }
  .slot.s3 .blk { height: 140px; background: linear-gradient(160deg, #ffe0c0, #d98d4c); }
  .spot { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,25,12,.75); transition: background .9s; }
  .spot .reveal { transition: transform .9s cubic-bezier(.5,0,.3,1), opacity .9s; }
  .spot .parab { font-family: 'Lilita One', sans-serif; font-size: 56px; color: var(--accent); margin-top: 18px; animation: pop .7s .5s both; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .spot.sai { background: transparent; } .spot.sai .parab { opacity: 0; transition: opacity .3s; }
  .hbars { display: grid; gap: 10px; margin-bottom: 16px; }
  .hb { display: grid; grid-template-columns: 48px 1fr 90px; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 12px; }
  .hb .sh { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 26px; color: #fff; }
  .hb .tx { font-weight: 800; font-size: 18px; margin-bottom: 6px; }
  .hb .tr { height: 18px; background: rgba(255,255,255,.12); border-radius: 9px; overflow: hidden; }
  .hb .tr i { display: block; height: 100%; width: 0; border-radius: 9px; transition: width 1.4s cubic-bezier(.2,1,.3,1); }
  .hb .n { font-family: 'Lilita One', sans-serif; font-size: 34px; text-align: right; }
  .hb.certa { background: rgba(31,163,74,.35); outline: 3px solid #fff; }

  /* revelação final */
  .reveal { border-radius: 26px; padding: 26px 40px; text-align: center; color: var(--ink); min-width: min(620px, 90vw); box-shadow: 0 20px 50px rgba(0,0,0,.45); animation: pop .9s cubic-bezier(.2,1.4,.4,1) both; }
  .reveal .lugar { font-family: 'Lilita One', sans-serif; font-size: 90px; line-height: 1; }
  .reveal .quem { font-family: 'Lilita One', sans-serif; font-size: 64px; line-height: 1.05; margin: 8px 0; word-break: break-word; }
  .reveal .det { font-size: 24px; font-weight: 800; }
  .reveal.p1 { background: linear-gradient(160deg, #fff3a6, #ffd700 50%, #e0a800); } .reveal.p2 { background: linear-gradient(160deg, #fff, #d9dee6); } .reveal.p3 { background: linear-gradient(160deg, #ffe0c0, #e39b5c); }
  .mini { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .mini .reveal { min-width: 0; padding: 10px 22px; animation: none; } .mini .reveal .lugar { font-size: 34px; } .mini .reveal .quem { font-size: 26px; } .mini .reveal .det { font-size: 15px; }
  .geral { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-weight: 800; font-size: 18px; }
  .geral th { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); text-align: right; padding: 4px 10px; vertical-align: bottom; max-width: 190px; }
  .geral th:nth-child(2), .geral td:nth-child(2) { text-align: left; }
  .geral td { background: rgba(255,255,255,.1); padding: 8px 10px; text-align: right; white-space: nowrap; }
  .geral td:first-child { border-radius: 10px 0 0 10px; text-align: center; } .geral td:last-child { border-radius: 0 10px 10px 0; color: var(--accent); font-size: 22px; }
  .geral td:first-child b { display: inline-block; min-width: 44px; background: var(--accent); color: var(--ink); border-radius: 8px; font-family: 'Lilita One', sans-serif; font-weight: 400; }
  .geral tr.top3 td { background: rgba(255,204,0,.18); }
  .geral td.nome { white-space: normal; max-width: 320px; } .geral td.zero { color: rgba(255,255,255,.35); }
  .geral th button { display: block; margin: 4px 0 0 auto; background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .tabgeral { overflow-x: auto; }
  .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; max-height: 52vh; overflow: hidden; align-content: start; }
  .lista div { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; font-weight: 800; font-size: 18px; animation: rise .5s both; }
  .lista div b { flex: none; min-width: 44px; text-align: center; background: var(--accent); color: var(--ink); border-radius: 8px; font-family: 'Lilita One', sans-serif; font-weight: 400; }
  .lista div span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista div small { opacity: .8; }
  /* visual empresarial: alternativas neutras, destaque só para a certa */
  .opt { background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2); box-shadow: none; }
  .opt .sh { background: var(--accent); color: #0b3d1c; }
  .opt.fade { opacity: .35; }
  .opt.right { background: var(--ok); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,204,0,.35); animation: pulse 1s ease-in-out 2; }
  .pl .opt { background: #fff; color: var(--ink); border: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  .pl .opt .sh { background: var(--bg2); color: #fff; }

  /* cabeçalho do telão */
  .topbar { display: flex; align-items: center; gap: 18px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 8px 16px; margin-bottom: 16px; }
  .topbar .tlogo { height: 70px; flex: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .topbar .ttl { flex: 1; min-width: 0; }
  .topbar .ttl small { display: block; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .topbar .ttl div { font-family: 'Lilita One', sans-serif; font-size: 32px; line-height: 1.1; }
  .topbar .tr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* animações */
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  .pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .rise { animation: rise .6s ease-out both; }

  /* celular */
  .pl-q { font-size: 20px; font-weight: 800; margin: 8px 0 14px; }
  .pl .opts { gap: 10px; }
  .pl .opt { font-size: 18px; min-height: 72px; padding: 12px 14px; }
  .pl .opt .sh { width: 38px; height: 38px; font-size: 22px; }
  .bar { height: 10px; background: rgba(255,255,255,.2); border-radius: 6px; overflow: hidden; width: 100%; margin: 8px 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
  .big { font-size: 72px; font-weight: 900; line-height: 1; }
  .huge { font-size: 160px; font-weight: 900; line-height: 1; color: var(--accent); }
  .res-ok { background: var(--ok); } .res-bad { background: var(--bad); }
  .full { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; overflow: auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

  /* telão */
  .qtext { background: #fff; color: var(--ink); border-radius: 14px; padding: 22px; font-size: 36px; font-weight: 800; text-align: center; margin-bottom: 16px; }
  .mid { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; margin-bottom: 16px; }
  .ring { position: relative; width: 150px; height: 150px; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 900; }
  .ring.hot b { color: var(--bad); animation: pulse .5s infinite; }
  .ring.hot circle.fg { stroke: var(--bad); }
  .prog { text-align: center; }
  .prog .n { font-size: 56px; font-weight: 900; }
  .prog .bar { height: 18px; }
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; }
  .qr { background: #fff; padding: 14px; border-radius: 14px; display: inline-block; }
  .code { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-height: 46vh; overflow: auto; }

<script>
// ---------- Configuração ----------
const SB_URL = 'https://pxmlqjeqptppgcctptuh.supabase.co';

// ---------- Utilidades ----------

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const seg = ms => (ms / 1000).toFixed(1).replace('.', ',') + 's';
const pts = n => Number(n || 0).toLocaleString('pt-BR');
const params = new URLSearchParams(location.search);

const sleep = ms => new Promise(r => setTimeout(r, ms));
let clockOffset = 0; // relógio do servidor - relógio local
const serverNow = () => Date.now() + clockOffset;
const store = {

// Marca da SIPAT 2026 (imagens em img/, tiradas da apresentação oficial)
const brand = (cls = '') => `<div class="brand ${cls}">

async function rpc(fn, args) {
  const t0 = Date.now();
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || 'Falha de conexão');
  if (data && data.agora) clockOffset = Date.parse(data.agora) - (t0 + Date.now()) / 2;
  return data;
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Não carregou ' + src));
    document.head.appendChild(s);
  });
}
const loadXlsx = () => window.XLSX ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
const loadQr = () => window.QRCode ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');

// Loop de consulta: chama fn a cada `ms`, sem sobrepor chamadas
function poller(fn, ms) {
  (async function loop() {
    for (;;) {
      try { await fn(); } catch (e) { console.warn(e); }
      await sleep(ms + Math.random() * 200);
    }
  })();
}

// Número subindo de `de` até `ate`
function contar(el, de, ate, ms = 1200, fmt = pts) {
  if (!el) return;
  const t0 = performance.now();
  const passo = t => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(de + (ate - de) * e));
    if (k < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function confete(ms = 6000) {
  const cv = document.createElement('canvas'); cv.className = 'confete';
  document.body.appendChild(cv);
  const cx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cores = ['#ffcc00', '#e21b3c', '#1368ce', '#26890c', '#ffffff', '#ff7a00'];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: -Math.random() * H, r: 5 + Math.random() * 7,
    vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6, c: cores[Math.random() * cores.length | 0] }));
  const fim = performance.now() + ms;
  (function frame(t) {
    cx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.a += .1;
      if (p.y > H && t < fim) { p.y = -10; p.x = Math.random() * W; }
      cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
    });
    if (t < fim + 3000) requestAnimationFrame(frame); else cv.remove();
  })(performance.now());
}

// Bipe dos últimos segundos (pressão!)
let audio, somOff = store.get('sq_som_off') === true;
function bipe(freq = 880, dur = .12, vol = .25, tipo = 'sine') {
  if (somOff) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(vol, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}

// Guarda arquivos no navegador (IndexedDB) — usado para a música escolhida pelo apresentador
function arquivoLocal(op, chave, valor) {
  return new Promise((ok, erro) => {
    const r = indexedDB.open('sipat-quiz', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('arquivos');
    r.onerror = () => erro(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('arquivos', op === 'get' ? 'readonly' : 'readwrite'), s = tx.objectStore('arquivos');
      const q = op === 'get' ? s.get(chave) : op === 'put' ? s.put(valor, chave) : s.delete(chave);
      tx.oncomplete = () => ok(q.result); tx.onerror = () => erro(tx.error);
    };
  });
}

// Trilha de suspense (clima de filme): zumbido grave que vai abrindo, tic-tac de relógio e batida de coração.
// Nos últimos 5s tudo acelera. Se o apresentador escolher um arquivo de música, ele toca no lugar.
const trilha = { prox: 0, passo: 0, drone: null };
function droneLiga() {
  if (somOff || trilha.drone) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const g = audio.createGain(), f = audio.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 6;
    g.gain.setValueAtTime(0, audio.currentTime); g.gain.linearRampToValueAtTime(.14, audio.currentTime + 1.5);
    const os = [55, 55.7, 82.4, 110.3].map(fr => {
      const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); return o;
    });
    f.connect(g); g.connect(audio.destination);
    trilha.drone = { g, f, os };
  } catch {}
}
function droneDesliga() {
  const d = trilha.drone; if (!d) return;
  trilha.drone = null;
  try { d.g.gain.cancelScheduledValues(audio.currentTime); d.g.gain.setTargetAtTime(0, audio.currentTime, .15); d.os.forEach(o => o.stop(audio.currentTime + 1)); } catch {}
}
function tocarTrilha(rest, total) {
  droneLiga();
  const urgente = rest <= 5000;
  if (trilha.drone) trilha.drone.f.frequency.setTargetAtTime(urgente ? 1600 : 220 + 700 * (1 - rest / total), audio.currentTime, .4);
  const agora = performance.now();
  if (agora < trilha.prox) return;
  trilha.prox = agora + (urgente ? 250 : 500);
  const p = trilha.passo++;
  bipe(p % 2 ? 1400 : 1850, .035, .09, 'square'); // tic-tac
  if (p % (urgente ? 2 : 4) === 0) { bipe(62, .14, .6); setTimeout(() => bipe(52, .14, .45), 160); } // tum-tum
}

        <p class="small" style="opacity:.8">Obrigado por participar da SIPAT!</p></div>`;
      confete(5000);
    }
  };

  const tick = () => {
    const now = serverNow();
    const cd = document.getElementById('cd');
    if (cd) {
      const n = Math.max(1, Math.ceil((Date.parse(st.inicio_em) - now) / 1000));
      if (n !== cdUlt) { cdUlt = n; cd.textContent = n; cd.classList.remove('pop'); void cd.offsetWidth; cd.classList.add('pop'); }
    }
    const tb = document.getElementById('tb'), tl = document.getElementById('tl');
    if (tb && st.fim_em) {
      const ini = Date.parse(st.inicio_em), fim = Date.parse(st.fim_em), rest = Math.max(0, fim - now);
      tb.style.width = (100 * rest / (fim - ini)) + '%';
      tb.style.background = rest < 5000 ? 'var(--bad)' : '';
      tl.textContent = Math.ceil(rest / 1000) + 's';
    }
    const nj = document.getElementById('njog');
    if (nj) nj.textContent = st.jogadores + ' participantes na sala';
  };

  const responder = async i => {
    enviando = st.idx; minha = i; render();
    try {
      const r = await rpc('sipat_quiz_responder', { p_codigo: codigo, p_jogador: me.jogador_id, p_token: me.token, p_idx: st.idx, p_opcao: i });
      if (r && r.ok === false) alert(r.motivo || 'Resposta não registrada');
    } catch (e) { alert(e.message); }
  };

  poller(async () => {
    try {
      st = await rpc('sipat_quiz_jogador_estado', { p_codigo: codigo, p_jogador: me.jogador_id, p_token: me.token });
      render();
    } catch (e) {
      if (/não encontrado/i.test(e.message)) { store.del('sq_player_' + codigo); location.href = '?c=' + codigo; }
      throw e;
    }
  }, 1000);
  setInterval(render, 150);
}

async function lerPlanilha(f) {
  let wb;
  if (/\.csv$/i.test(f.name)) {
    const buf = await f.arrayBuffer();
    let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('�')) txt = new TextDecoder('windows-1252').decode(buf); // CSV salvo pelo Excel
    const l1 = txt.split(/\r?\n/)[0];
    const sep = (l1.split(';').length > l1.split(',').length) ? ';' : ',';
    wb = XLSX.read(txt, { type: 'string', FS: sep, raw: true });
  } else {
    wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  }
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
}

function converter(rows) {
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const head = (rows[0] || []).map(norm);
  // posição padrão: Pergunta, A, B, C, D, Correta, Tempo
  const col = { q: 0, ops: [1, 2, 3, 4], cor: 5, t: 6 };
  const temCabecalho = head.some(h => /pergunta|correta|resposta|gabarito/.test(h));
  if (temCabecalho) {
    head.forEach((h, i) => {
      if (/^pergunta|^questao/.test(h)) col.q = i;
      else if (/correta|resposta certa|gabarito|^resposta$/.test(h)) col.cor = i;
      else if (/^tempo/.test(h)) col.t = i;
      else {
        const m = h.match(/^(?:opcao|alternativa|resposta)?\s*([abcd])\)?$/);
        if (m) col.ops['abcd'.indexOf(m[1])] = i;
      }
    });
  }
  const lista = [], erros = [];
  rows.slice(temCabecalho ? 1 : 0).forEach((r, n) => {
    const linha = n + (temCabecalho ? 2 : 1);
    const texto = String(r[col.q] ?? '').trim();
    const brutas = col.ops.map(i => String(r[i] ?? '').trim());
    if (!texto && brutas.every(o => !o)) return; // linha vazia
    const opcoes = [], mapa = [];
    brutas.forEach((o, i) => { if (o) { mapa[i] = opcoes.length; opcoes.push(o); } });
    const c = norm(r[col.cor] ?? '');
    let ci = -1;
    if (/^[abcd]$/.test(c)) ci = 'abcd'.indexOf(c);
    else if (/^[1-4]$/.test(c)) ci = +c - 1;
    else ci = brutas.findIndex(o => o && norm(o) === c);
    const correta = ci >= 0 ? mapa[ci] : undefined;
    let tempo = parseInt(r[col.t], 10);
    if (!(tempo >= 5)) tempo = 20;
    if (!texto) return erros.push(`Linha ${linha}: pergunta vazia`);
    if (opcoes.length < 2) return erros.push(`Linha ${linha}: precisa de pelo menos 2 alternativas`);
    if (correta === undefined) return erros.push(`Linha ${linha}: coluna "Correta" deve ser A, B, C ou D (de uma alternativa preenchida)`);
    lista.push({ texto, opcoes, correta, tempo: Math.min(tempo, 120) });
  });
  if (lista.length > 100) erros.push('Máximo de 100 perguntas');
  return { lista, erros };
}

async function hostGame(codigo) {
  const token = store.get('sq_host_' + codigo);
  const senha = store.get('sq_senha');
  if (!token) {
    $app.innerHTML = `<div class="center"><div class="card"><h2>Telão indisponível</h2>
      <p>Esta sala foi aberta em outro computador/navegador. Abra uma nova sala aqui.</p>
      <button class="btn go" onclick="location.href='?adm'">Ir para o administrador</button></div></div>`;
    return;
  }
  await loadQr().catch(() => {});
  const joinUrl = baseUrl + '?c=' + codigo;
  // Depois que a pergunta fecha: 'resposta' -> 'stats' -> 'rank'
  let st = null, viewKey = '', tela = 'resposta', ocupado = false, bipUlt = null, modelos = [], ultRv = null, dicaUlt = -1;
  // Contagem para o início (só no telão; o quiz começa quando você clicar em "Começar")
  let cronoFim = store.get('sq_crono_' + codigo);
  window.__som = () => { somOff = !somOff; store.set('sq_som_off', somOff); if (somOff) pararTrilha(); viewKey = ''; render(); };

  // Música própria (arquivo escolhido neste computador; fica guardada só neste navegador)
  let musica = null, musicaNome = null;
  const pararTrilha = () => { droneDesliga(); if (musica && !musica.paused) musica.pause(); };
  const usarMusica = reg => {
    if (musica) { musica.pause(); URL.revokeObjectURL(musica.src); }
    musica = reg ? new Audio(URL.createObjectURL(reg.blob)) : null;
    if (musica) { musica.loop = true; musica.volume = .7; }
    musicaNome = reg ? reg.nome : null;
    const el = document.getElementById('mus-nome'); if (el) el.textContent = musicaNome || 'trilha de suspense do quiz';
    const x = document.getElementById('mus-x'); if (x) x.style.display = musicaNome ? '' : 'none';
  };
  arquivoLocal('get', 'musica').then(usarMusica).catch(() => {});
  window.__musica = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'audio/*';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      const reg = { nome: f.name, blob: f };
      try { await arquivoLocal('put', 'musica', reg); } catch {}
      usarMusica(reg);
      musica.play().then(() => setTimeout(() => musica.pause(), 2500)).catch(() => {}); // amostra de 2,5s
    };
    inp.click();
  };
  window.__semMusica = async () => { try { await arquivoLocal('delete', 'musica'); } catch {} usarMusica(null); };
  window.__crono = min => { cronoFim = min ? Date.now() + min * 60000 : null; store.set('sq_crono_' + codigo, cronoFim); };

  const acao = async a => {
    if (ocupado) return; ocupado = true;
    bipe(660, .05);
    try { await rpc('sipat_quiz_host_acao', { p_codigo: codigo, p_token: token, p_acao: a }); tela = 'resposta'; await atualizar(); }
    catch (e) { alert(e.message); }
    ocupado = false;
  };
  window.__acao = acao;
  window.__tela = t => { tela = t; viewKey = ''; render(); };
  window.__reiniciar = () => {
    if (confirm('Reiniciar o quiz?\n\nZera pontos e respostas e volta para a sala de espera. Os participantes continuam conectados.')) acao('reiniciar');
  };
  window.__limpar = () => {

  if (senha) modelos = await rpc('sipat_quiz_modelo_listar', { p_senha: senha }).catch(() => []);

  const render = () => {

  const opcoesHtml = (q, mostrarCerta) => `<div class="opts">${q.opcoes.map((o, i) =>
    `<div class="opt o${i} ${mostrarCerta ? (i === q.correta ? 'right' : 'fade') : 'pop'}" style="animation-delay:${i * .1}s"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span>${mostrarCerta && i === q.correta ? '<span style="margin-left:auto">✔</span>' : ''}</div>`).join('')}</div>`;

  const masc = (fala, cls = '') => `<div class="masc ${cls}"><img src="img/tormentinha.png" alt="Tormentinha"><div class="fala">${fala}</div></div>`;
  const selo = ''; // a marca SIPAT fica no cabeçalho

  // Frase do Tormentinha no ranking
  const falaRanking = () => {
    const r = st.ranking, lider = r[0];
    if (!lider || !lider.pontos) return 'Ninguém pontuou ainda… bora acelerar! ⚡';
    if (st.idx === 0) return `<b>${esc(lider.nome)}</b> saiu na frente! 🚀`;

    if (fg.total >= 3) return `🔥 <b>${fg.total} pessoas</b> estão pegando fogo! (3+ acertos seguidos = +200)`;
    if (fg.total > 0) return `🔥 <b>${fg.nomes.map(esc).join('</b> e <b>')}</b> ${fg.total > 1 ? 'estão' : 'está'} pegando fogo! +200 de bônus`;

    if (sub) return `<b>${esc(sub.nome)}</b> subiu ${sub.pos_ant - sub.pos} posições! 📈`;
    return `<b>${esc(lider.nome)}</b> segue na liderança! 👑`;
  };

  // Gráfico de rosca: acertos x erros x não responderam
  const DC = 2 * Math.PI * 80;
  const donutHtml = (ac, er, na) => {
    const tot = Math.max(1, ac + er + na), seg3 = [[ac, 'var(--ok)'], [er, 'var(--bad)'], [na, '#9aa3ad']];

      const len = DC * n / tot, c = `<circle data-len="${len}" cx="100" cy="100" r="80" fill="none" stroke="${cor}" stroke-width="30"
        style="stroke-dasharray:0 ${DC};stroke-dashoffset:${-off};transition:stroke-dasharray 1.1s ${.2 + i * .9}s ease-out"/>`;
      off += len; return c;
    }).join('');
    return `<div class="dn"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="#eef0f3" stroke-width="30"/>
      <g transform="rotate(-90 100 100)">${arcos}</g></svg>
      <div class="cen"><b data-n="${Math.round(100 * ac / tot)}">0</b><span>%</span><small>acertaram</small></div></div>`;
  };
  // Pictograma: um bonequinho por participante, acendendo um a um
  const bonecos = (ac, er, na) => {
    const lista = [...Array(ac).fill('ok'), ...Array(er).fill('er'), ...Array(na).fill('na')];
    const passo = Math.min(.06, 2.4 / Math.max(1, lista.length));
    return lista.map((c, i) => `<svg class="pp ${c}" style="animation-delay:${(.3 + i * passo).toFixed(2)}s" viewBox="0 0 20 32"><circle cx="10" cy="6" r="5.5"/><path d="M2 32V20a8 8 0 0 1 16 0v12z"/></svg>`).join('');
  };

  // Rufar de tambores para a revelação final
  const tambor = () => { for (let i = 0; i < 22; i++) setTimeout(() => bipe(90 + Math.random() * 40, .05), i * 55); setTimeout(() => bipe(880, .4), 1300); };

  const proximaBtn = () => st.idx + 1 >= st.total

  const RH = 64;
  const rankingHtml = () => `<div class="rk" id="rk" style="height:${st.ranking.length * RH}px">${st.ranking.map(r => {

  const animarRanking = () => setTimeout(() => {

  const draw = prep => {
    const topo = `<div class="topbar"><img class="tlogo" src="img/logo-sipat.png" alt="SIPAT">

    if (st.status === 'lobby') {

      $app.innerHTML = `<div class="wrap">

                <div class="crono-bt"><span class="small" style="opacity:.8;align-self:center" title="Só mostra um relógio no telão; o quiz começa quando você clicar em Começar quiz">⏱ Mostrar contagem para o início:</span>
                  ${[2, 5, 10].map(m => `<button class="btn ghost" onclick="__crono(${m})">${m} min</button>`).join('')}
                  <button class="btn ghost" onclick="__crono(0)">✕</button></div></div></div>
            <div class="chips" id="chips"></div>

              <button class="link" onclick="__musica()">escolher arquivo</button>

            <div class="actions" style="justify-content:flex-start">
              <button class="btn go" style="font-size:22px" ${st.total ? '' : 'disabled title="Escolha o quiz primeiro"'} onclick="__acao('proxima')">Começar quiz ▶</button>
              ${st.jogadores ? `<button class="btn ghost" style="min-width:0" onclick="__limpar()">Remover participantes</button>` : ''}</div></div>
        </div></div>`;
      dicaUlt = -1;
      if (window.QRCode) new QRCode(document.getElementById('qr'), { text: joinUrl, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
    } else if (st.status === 'pergunta' && prep) {
      $app.innerHTML = `<div class="wrap">${topo}<div class="center" style="min-height:75vh">
        ${st.bonus ? `<div class="bonusbar pop">⚡ PERGUNTA BÔNUS — vale o DOBRO! ⚡</div>` : `<div class="badge">Pergunta ${st.idx + 1} de ${st.total}</div>`}
        <div class="qtext pop" style="margin-top:20px;max-width:1100px">${esc(st.pergunta.texto)}</div>
        <div class="huge" id="cd"></div><p style="font-size:22px">Prepare-se!</p></div></div>`;
      if (st.bonus) bipe(1320, .3);
    } else if (st.status === 'pergunta') {
      // Tela 3: pergunta, cronômetro e quantos já responderam
      $app.innerHTML = `<div class="wrap">${topo}
        ${st.bonus ? `<div style="text-align:center;margin-bottom:10px"><div class="bonusbar">⚡ PERGUNTA BÔNUS — vale o DOBRO! ⚡</div></div>` : ''}
        <div class="qtext">${esc(st.pergunta.texto)}</div>
        <div class="mid">
          <div class="ring" id="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="rgba(255,255,255,.2)" stroke-width="12" fill="none"/>
            <circle class="fg" id="arc" cx="75" cy="75" r="64" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="0"/></svg><b id="tm"></b></div>
          <div class="prog"><div class="n"><span id="nr">0</span> <span style="font-size:28px;opacity:.8">de <span id="nj">0</span> responderam</span></div>
            <div class="bar"><i id="pb" style="width:0"></i></div></div>
          <button class="btn warn" style="width:auto" onclick="__acao('encerrar')">Finalizar pergunta ⏹</button></div>
        ${opcoesHtml(st.pergunta, false)}</div>`;
    } else if (st.status === 'resultado' && tela === 'resposta') {
      // Tela 4a: a pergunta com a resposta certa
      const c = st.pergunta.correta;
      $app.innerHTML = `<div class="wrap">${topo}
        <div class="qtext">${esc(st.pergunta.texto)}</div>
        ${opcoesHtml(st.pergunta, true)}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap">
          ${masc(`A resposta certa é a <b>letra ${LETRAS[c]}</b>! ✅`)}
          <div class="actions" style="margin:0"><button class="btn go" style="font-size:22px" onclick="__tela('stats')">Ver estatísticas 📊</button></div></div></div>${selo}`;
      bipe(1046, .25);
    } else if (st.status === 'resultado' && tela === 'stats') {
      // Tela 4b: acertos, erros, respostas por alternativa, mais rápida, mais lenta e média
      const d = st.distribuicao || [], s = st.stats || {}, tot = Math.max(1, d.reduce((a, b) => a + b, 0));
      const ac = s.acertos || 0, er = s.erros || 0, na = Math.max(0, st.jogadores - ac - er);
      const taxa = st.jogadores ? ac / st.jogadores : 0;
      // Na última pergunta não mostramos nomes nem ranking: o resultado é revelado no pódio
      const ultima = st.idx + 1 >= st.total;
      const segredo = '🤫 só no pódio!';
      const fala = ultima ? 'Última pergunta encerrada! Quem será o grande <b>campeão</b>? 🥁' : !st.jogadores ? 'Cadê a galera? 😅' : taxa >= .8 ? 'Mandaram muito bem, galera! 👏' : taxa >= .5 ? 'Boa! A maioria acertou! 💪' : taxa > 0 ? 'Essa foi difícil, hein? 🤔' : 'Ninguém acertou! Presta atenção na palestra! 😱';
      $app.innerHTML = `<div class="wrap">${topo}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px">
          <h1 class="pop" style="font-size:46px;margin:0">📊 Como a galera foi</h1>${masc(fala)}</div>
        <div class="raiox">
          <div class="rx-card donut">${donutHtml(ac, er, na)}
            <div class="leg"><div><i style="background:var(--ok)"></i>Acertos<b data-n="${ac}">0</b></div>
              <div><i style="background:var(--bad)"></i>Erros<b data-n="${er}">0</b></div>
              <div><i style="background:#9aa3ad"></i>Não responderam<b data-n="${na}">0</b></div></div></div>
          <div class="rx-card"><div class="t">Cada bonequinho é uma pessoa</div>
            <div class="picto ${st.jogadores > 60 ? 'p3' : st.jogadores > 30 ? 'p2' : ''}">${bonecos(ac, er, na)}</div>
            <div class="letras">${d.map((n, i) => `<div class="${i === st.pergunta.correta ? 'certa' : ''}"><span>${LETRAS[i]}</span><b data-n="${n}">0</b> ${n === 1 ? 'pessoa' : 'pessoas'}${i === st.pergunta.correta ? ' ✔' : ''}</div>`).join('')}</div></div>
        </div>
        <div class="kpis" style="margin-top:14px">
          <div class="kpi t" style="animation-delay:.4s"><div class="l">⚡ Mais rápida</div><div class="v">${s.rapido ? seg(s.rapido.ms) : '–'}</div><div class="nm">${!s.rapido ? 'ninguém acertou' : ultima ? segredo : esc(s.rapido.nome)}</div></div>
          <div class="kpi t" style="animation-delay:.55s"><div class="l">⏱️ Tempo médio</div><div class="v">${s.media_ms != null ? seg(s.media_ms) : '–'}</div><div class="nm">de quem acertou</div></div>
          <div class="kpi t" style="animation-delay:.7s"><div class="l">🐢 Mais lenta</div><div class="v">${s.lento ? seg(s.lento.ms) : '–'}</div><div class="nm">${!s.lento ? '–' : ultima ? segredo : esc(s.lento.nome)}</div></div>
        </div>
        <div class="actions"><button class="btn light" onclick="__tela('resposta')">◀ Resposta</button>
          ${ultima
            ? `<button class="btn go" style="font-size:24px;padding:18px 34px" onclick="__acao('proxima')">🥁 Revelar os vencedores 🏆</button>`
            : `<button class="btn go" style="font-size:22px" onclick="__tela('rank')">Ver ranking 🏆</button>`}</div></div>${selo}`;
      document.querySelectorAll('[data-n]').forEach(el => contar(el, 0, +el.dataset.n, 1200));
      setTimeout(() => document.querySelectorAll('.donut circle[data-len]').forEach(el => {
        el.style.strokeDasharray = `${el.dataset.len} ${DC - el.dataset.len}`;
      }), 80);
      if (ac > 0) bipe(1200, .2);
    } else if (st.status === 'resultado') {
      // Tela 5: ranking animado com o Tormentinha
      $app.innerHTML = `<div class="wrap">${topo}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px">
          <h1 class="pop" style="font-size:52px;margin:0">🏆 Ranking <span style="font-size:24px;opacity:.8">após a pergunta ${st.idx + 1}</span></h1>
          ${masc(falaRanking())}</div>
        ${rankingHtml()}
        <div class="actions"><button class="btn light" onclick="__tela('stats')">◀ Estatísticas</button>${proximaBtn()}</div></div>${selo}`;
      animarRanking();
    } else if (st.status === 'fim') {
      // Revelação final: suspense -> 3º -> 2º -> 1º -> lista completa
      const cl = st.classificacao || [], rv = st.revelado;
      const card = (p, cls = '') => {
        const x = cl[p - 1];
        return `<div class="reveal p${p} ${cls}"><div class="lugar">${['🥇', '🥈', '🥉'][p - 1]} ${p}º lugar</div>
          <div class="quem">${x ? esc(x.nome) : '—'}</div>
          ${x ? `<div class="det">${pts(x.pontos)} pontos · ${x.acertos} acerto${x.acertos === 1 ? '' : 's'} · ${seg(x.tempo_ms)}</div>` : ''}</div>`;
      };
      const btn = (txt, cls = 'go') => `<button class="btn ${cls}" style="font-size:24px;padding:18px 34px" onclick="__acao('revelar')">${txt}</button>`;
      let corpo;
      if (rv === 0) {
        corpo = `<div class="center" style="min-height:70vh">
          <h1 class="pop" style="font-size:64px">Quiz finalizado! 🎉</h1>
          ${masc('Rufem os tambores… 🥁<br>Vamos conhecer os <b>grandes vencedores</b>!', 'big')}
          <div class="actions">${btn('Revelar o 3º lugar 🥉')}</div></div>`;
      } else if (rv <= 3) {
        // Pódio sendo montado: o novo colocado aparece grande ("Parabéns!"), encolhe e desce para o seu degrau
        const novo = 4 - rv, animar = ultRv !== null && rv > ultRv;
        const slot = p => {
          const x = cl[p - 1], visto = rv >= 4 - p;
          return `<div class="slot s${p} ${!visto || (animar && p === novo) ? 'pend' : ''}" id="slot${p}">
            <div class="nm">${visto && x ? esc(x.nome) : '?'}</div>
            <div class="pt">${visto && x ? `${pts(x.pontos)} pts · ${x.acertos} acerto${x.acertos === 1 ? '' : 's'} · ${seg(x.tempo_ms)}` : '&nbsp;'}</div>
            <div class="blk">${p}º</div></div>`;
        };
        const prox = rv === 1 ? 'Revelar o 2º lugar 🥈' : rv === 2 ? 'Revelar o CAMPEÃO 🏆' : 'Ver classificação completa 📋';
        corpo = `<h1 class="pop" style="text-align:center;font-size:48px;margin:6px 0">🏆 Os vencedores</h1>

          <div class="actions">${btn(prox, rv === 3 ? 'light' : 'go')}</div>

      } else {
        corpo = `<h1 class="pop" style="text-align:center;font-size:48px">📋 Classificação final — ${cl.length} participantes</h1>
          <div class="mini">${card(1)}${card(2)}${card(3)}</div>
          <div class="lista" id="lista">${cl.map((x, i) => `<div style="animation-delay:${Math.min(i, 40) * .03}s"><b>${x.pos}º</b><span>${esc(x.nome)}</span><small>${pts(x.pontos)}</small></div>`).join('')}</div>
          <div class="actions"><button class="btn light" onclick="__reiniciar()">↺ Reiniciar quiz</button>
            <button class="btn ghost" onclick="location.href='?adm=geral'">🏆 Ranking geral</button>

      }

      }

  // O cartão grande encolhe e vai até o degrau do pódio
  const descerParaPodio = p => {
    const spot = document.getElementById('spot'), slot = document.getElementById('slot' + p);
    if (!spot || !slot) return;
    const card = spot.querySelector('.reveal'), a = card.getBoundingClientRect(), b = slot.getBoundingClientRect();
    const s = Math.min(1, b.width / a.width);
    spot.classList.add('sai');
    card.style.animation = 'none'; void card.offsetWidth; // solta a animação de entrada para a transição funcionar
    card.style.transform = `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px, ${b.top + 40 - (a.top + a.height / 2)}px) scale(${s})`;
    card.style.opacity = '0';
    setTimeout(() => {
      spot.remove(); slot.classList.remove('pend'); slot.classList.add('land');

  };

  // Lista longa: rola devagar sozinha para todos acharem o nome
  const rolarLista = () => {
    const el = document.getElementById('lista');
    if (!el || el.scrollHeight <= el.clientHeight) return;
    let dir = 1;
    const passo = () => {
      if (!document.body.contains(el)) return;
      el.scrollTop += dir;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) dir = -1;
      else if (el.scrollTop <= 0) dir = 1;
      setTimeout(passo, 40);
    };
    setTimeout(passo, 3000);
  };

  const tick = () => {
    const now = serverNow();
    const cd = document.getElementById('cd');
    if (cd) {
      const n = Math.max(1, Math.ceil((Date.parse(st.inicio_em) - now) / 1000));
      if (cd.textContent !== String(n)) { cd.textContent = n; cd.classList.remove('pop'); void cd.offsetWidth; cd.classList.add('pop'); bipe(440, .08); }
    }
    const tm = document.getElementById('tm');
    if (tm) {
      const ini = Date.parse(st.inicio_em), fim = Date.parse(st.fim_em), rest = Math.max(0, fim - now), s = Math.ceil(rest / 1000);
      tm.textContent = s;
      document.getElementById('arc').setAttribute('stroke-dashoffset', 402 * (1 - rest / (fim - ini)));
      document.getElementById('ring').classList.toggle('hot', rest <= 5000);
      if (rest <= 5000 && s > 0 && s !== bipUlt) { bipUlt = s; bipe(s <= 3 ? 1000 : 800, .1); }
      if (rest > 0 && !somOff) {
        if (musica) { if (musica.paused) { musica.currentTime = 0; musica.play().catch(() => {}); } musica.playbackRate = rest <= 5000 ? 1.12 : 1; }
        else tocarTrilha(rest, fim - ini);
      } else pararTrilha();
    } else pararTrilha();
    const dt = document.getElementById('dica-txt');
    if (dt) {
      const i = Math.floor(Date.now() / 9000) % DICAS.length;
      if (i !== dicaUlt) {
        dicaUlt = i; dt.innerHTML = DICAS[i];
        const f = dt.closest('.fala'); f.style.animation = 'none'; void f.offsetWidth; f.style.animation = '';
      }
    }
    const cr = document.getElementById('crono');
    if (cr) {
      const rest = cronoFim ? Math.max(0, cronoFim - Date.now()) : null;
      cr.textContent = rest == null ? '' : rest > 0
        ? `Começa em ${String(Math.floor(rest / 60000)).padStart(2, '0')}:${String(Math.floor(rest / 1000) % 60).padStart(2, '0')}`
        : 'Vai começar! 🚀';
    }
    const nj = document.getElementById('nj'); if (nj) nj.textContent = st.jogadores;
    const njs = document.getElementById('njs'); if (njs) njs.textContent = st.jogadores === 1 ? 'participante' : 'participantes';
    const nr = document.getElementById('nr'); if (nr) nr.textContent = st.respostas;
    const pb = document.getElementById('pb'); if (pb) pb.style.width = (st.jogadores ? 100 * st.respostas / st.jogadores : 0) + '%';
    const chips = document.getElementById('chips');
    if (chips) {
      const validos = new Set(st.nomes);
      [...chips.children].forEach(c => { if (!validos.has(c.textContent)) c.remove(); });
      const atuais = new Set([...chips.children].map(c => c.textContent));
      st.nomes.slice().reverse().forEach(n => {
        if (!atuais.has(n)) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = n; chips.prepend(c); }
      });
    }
  };

  const atualizar = async () => {
    try { st = await rpc('sipat_quiz_host_estado', { p_codigo: codigo, p_token: token }); }
    catch (e) {
      if (!/não encontrado/i.test(e.message)) throw e;
      store.del('sq_host_ultimo');
      location.href = '?adm';
    }
    render();
  };
  poller(atualizar, 1000);
  setInterval(render, 60); // ritmo da trilha e do cronômetro
}
</script>
</body>
</html>
